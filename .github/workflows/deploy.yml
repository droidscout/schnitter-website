name: Deploy to Docker Swarm

on:
  push:
    branches:
      - master
      - staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push the version bump
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      REMOTE_PROJECT_PATH: ${{ secrets.REMOTE_PROJECT_PATH }}
      STACK_NAME: ${{ secrets.STACK_NAME }}
      REMOTE_COMPOSE_FILE: ${{ secrets.REMOTE_COMPOSE_FILE }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      CONTACT_RECEIVER_EMAIL: ${{ secrets.CONTACT_RECEIVER_EMAIL }}
      FRONTEND_BASE_URL: ${{ secrets.FRONTEND_BASE_URL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
      SMTP_AUTH_METHOD: ${{ secrets.SMTP_AUTH_METHOD }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      API_SERVICE_SECRET: ${{ secrets.API_SERVICE_SECRET }}
      RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Bump Version
        id: version_bump
        run: |
          chmod +x scripts/bump_version.sh
          ./scripts/bump_version.sh
        # This script outputs NEW_VERSION to GITHUB_ENV

      - name: Build and Push API
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: droidscout/schnitter-api:${{ env.NEW_VERSION }},droidscout/schnitter-api:latest
          platforms: linux/amd64

      - name: Build and Push Web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
             VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
             VITE_RECAPTCHA_SITE_KEY=${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          tags: droidscout/schnitter-web:${{ env.NEW_VERSION }},droidscout/schnitter-web:latest
          platforms: linux/amd64

      - name: Commit and Push Version Bump
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docker-compose.yml
          git commit -m "chore: bump version to ${{ env.NEW_VERSION }} [skip ci]"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin ${GITHUB_REF_NAME}

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ env.SSH_PRIVATE_KEY }}

      - name: Trust remote host key
        run: |
          mkdir -p ~/.ssh
          PORT=${SSH_PORT:-22}
          ssh-keyscan -p "$PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy stack
        shell: bash
        run: |
          set -euo pipefail
          PORT=${SSH_PORT:-22}
          COMPOSE_FILE_PATH=${REMOTE_COMPOSE_FILE:-docker-compose.yml}

          # Fail fast on missing secrets. Previously an unset secret was written
          # to .env as an empty value, which silently disabled the feature it
          # belonged to (e.g. RECAPTCHA_SECRET_KEY turning off captcha checks).
          missing=()
          for var in CONTACT_RECEIVER_EMAIL FRONTEND_BASE_URL SMTP_HOST SMTP_PORT \
                     SMTP_SECURE SMTP_AUTH_METHOD SMTP_USER SMTP_PASS \
                     API_SERVICE_SECRET RECAPTCHA_SECRET_KEY; do
            [ -n "${!var:-}" ] || missing+=("$var")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            exit 1
          fi

          # Render the .env fragment here, with every value single-quoted, so
          # that special characters in passwords survive `source` on the remote
          # host. Shipped as base64 because that is safe inside the ssh heredoc.
          quote() {
            local esc=${2//\'/\'\\\'\'}
            printf "%s='%s'\n" "$1" "$esc"
          }
          ENV_B64=$(
            {
              quote CONTACT_RECEIVER_EMAIL "$CONTACT_RECEIVER_EMAIL"
              quote FRONTEND_BASE_URL      "$FRONTEND_BASE_URL"
              quote SMTP_HOST              "$SMTP_HOST"
              quote SMTP_PORT              "$SMTP_PORT"
              quote SMTP_SECURE            "$SMTP_SECURE"
              quote SMTP_AUTH_METHOD       "$SMTP_AUTH_METHOD"
              quote SMTP_USER              "$SMTP_USER"
              quote SMTP_PASS              "$SMTP_PASS"
              quote API_SERVICE_SECRET     "$API_SERVICE_SECRET"
              quote RECAPTCHA_SECRET_KEY   "$RECAPTCHA_SECRET_KEY"
            } | base64 -w0
          )

          ssh -p "$PORT" "$SSH_USER@$SSH_HOST" <<EOF
          set -euo pipefail
          cd "$REMOTE_PROJECT_PATH"

          # Keep unmanaged entries, replace the ones we own.
          touch .env
          cp .env .env.bak || true
          chmod 600 .env .env.bak
          grep -vE "^(CONTACT_RECEIVER_EMAIL|FRONTEND_BASE_URL|SMTP_HOST|SMTP_PORT|SMTP_SECURE|SMTP_AUTH_METHOD|SMTP_USER|SMTP_PASS|API_SERVICE_SECRET|RECAPTCHA_SECRET_KEY)=" .env.bak > .env || true
          printf %s "$ENV_B64" | base64 -d >> .env
          chmod 600 .env

          # Source .env to make variables available to docker stack deploy
          set -a
          source .env
          set +a

          echo "Logging into Docker Hub..."
          echo "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USERNAME}" --password-stdin

          echo "Fetching latest changes..."
          git fetch origin ${GITHUB_REF_NAME}
          git reset --hard origin/${GITHUB_REF_NAME}

          echo "Deploying stack with version ${{ env.NEW_VERSION }}..."
          # We use --prune to remove orphaned services
          docker stack deploy --prune --with-registry-auth -c "$COMPOSE_FILE_PATH" "$STACK_NAME"
          EOF
